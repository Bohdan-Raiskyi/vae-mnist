seed: 1
device: auto
deterministic: true
data:
  val_size: 5000
  split_seed: 42
  train_fraction: 1.0
model:
  type: vae
  arch: conv
  latent_dim: 8
train:
  batch_size: 128
  steps: 12000
  lr: 0.001
  weight_decay: 0.0
  beta: 1.0
  kl_warmup_steps: 0
  grad_clip: null
  eval_every: 500
eval:
  n_generated: 10000
  ambiguous_threshold: 0.9
experiment: e2_latent_dim
